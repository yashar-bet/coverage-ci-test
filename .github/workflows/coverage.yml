name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0 # Adjust to your target version

    # Run tests and output standard visual studio coverage logs
    - name: Run Tests with Coverage
      run: |
        dotnet test --verbosity normal --logger "trx;LogFileName=test_results.trx" --collect:"XPlat Code Coverage"

    # Dig out the specific percentage from the coverage summary using bash
    - name: Extract Coverage Percentage
      id: extract_coverage
      run: |
        # Search for the coverage xml file generated by coverlet
        COVERAGE_FILE=$(find . -name "coverage.cobertura.xml" | head -n 1)
        
        # Parse the line-rate from the XML (e.g., line-rate="0.8571" -> 86%)
        LINE_RATE=$(grep -oPm1 '(?<=line-rate=")[^"]+' "$COVERAGE_FILE")
        PERCENTAGE=$(echo "($LINE_RATE * 100) / 1" | bc)
        
        echo "Parsed Coverage: $PERCENTAGE%"
        echo "percentage=$PERCENTAGE" >> $GITHUB_OUTPUT

    # Push just the percentage value to your public gist
    - name: Update Coverage Badge Gist
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 26f1d374c459c231b4f3bbb75e8657c5
        filename: coverage.json
        label: Code Coverage
        message: ${{ steps.extract_coverage.outputs.percentage }}%
        valColorRange: ${{ steps.extract_coverage.outputs.percentage }}
        maxColorRange: 100
        minColorRange: 0