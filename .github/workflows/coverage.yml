name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Test Calculator with Coverage
        run: |
          dotnet test tests/Calculator.Tests/Calculator.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/Calculator

      - name: Test Greeter with Coverage
        run: |
          dotnet test tests/Greeter.Tests/Greeter.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/Greeter

      - name: Install ReportGenerator
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Badges
        run: |
          reportgenerator \
            -reports:"TestResults/Calculator/**/coverage.cobertura.xml" \
            -targetdir:"coverage/calculator" \
            -reporttypes:"Badges"

          reportgenerator \
            -reports:"TestResults/Greeter/**/coverage.cobertura.xml" \
            -targetdir:"coverage/greeter" \
            -reporttypes:"Badges"

      - name: Commit Badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add coverage/

          git diff --cached --quiet || git commit -m "Update coverage badges"
          git push
